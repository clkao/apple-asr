[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "apple-asr"
version = "0.1.4"
description = "Streaming, on-device speech-to-text for macOS 26+ (Apple SpeechAnalyzer) from Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
keywords = ["asr", "speech-to-text", "speechanalyzer", "macos", "streaming"]
dependencies = ["numpy>=1.23"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=7.0"]

[project.scripts]
apple-asr-shim = "apple_asr.cli:main"
apple-asr-replay = "apple_asr.replay:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs macOS 26+ and the real shim (skipped on other platforms)",
]
filterwarnings = [
    "error::DeprecationWarning:apple_asr.*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apple_asr"]
# The prebuilt shim, staged into the package tree by scripts/build_wheel.sh, is
# package data for the platform wheels (and only for them: it stays out of the
# sdist, whose consumers compile it). It is normally a build product, so
# .gitignore excludes it from git; `artifacts` re-includes it in the wheel
# despite that, and a tree without it still builds (a source `py3-none-any`
# wheel).
artifacts = ["src/apple_asr/shim/apple-asr-shim"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The fake shim is test scaffolding that must stay a standalone script.
"tests/fixtures/fake_shim.py" = ["E501"]
