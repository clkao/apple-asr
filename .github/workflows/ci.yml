name: ci

on:
  push:
  pull_request:

jobs:
  # Runs anywhere: the whole suite outside the `integration` marker drives the
  # transport with a scripted fake shim (tests/fixtures/fake_shim.py) in a tmp
  # APPLE_ASR_CACHE. No macOS, no Speech framework, no writable ~/.cache.
  fake-shim:
    name: fake-shim tests (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Import check
        run: python -c "import apple_asr; print(apple_asr.__version__)"
      - name: Lint
        run: ruff check .
      - name: Tests (fake shim; integration marked tests skip off macOS 26)
        run: pytest -q -m "not integration"

  # The macOS 26 integration tests (tests/test_integration_*.py) need a macOS 26
  # runner with the Speech framework and a built shim:
  #   python -m apple_asr.build
  #   pytest -q -m integration
  # `macos-26` GitHub-hosted runners do exist (wheel.yml uses one to build the
  # platform wheel), but this job stays undeclared: it needs the on-device zh-TW
  # asset, which the runner would have to download, and a failing integration
  # job on every push is not worth that yet. Run it on a real macOS 26 machine;
  # the tests fail loudly there if the shim cannot be resolved.
